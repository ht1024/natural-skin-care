  <body>
    <div id="root"></div>
    <script>
      // Applies the saved theme before first paint to prevent a flash of the
      // wrong palette. Dark is the default for everyone; only a returning
      // visitor who explicitly picked light mode gets the light palette.
      (function () {
        var saved = localStorage.getItem("theme");
        if (saved === "light") {
          document.documentElement.classList.remove("dark");
        } else {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
